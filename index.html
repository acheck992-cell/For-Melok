<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06080d">
  <title>For Melok · A Study in Light</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       CSS RESET & DESIGN SYSTEM
       ================================---------- */
    :root {
      --bg: #06080d;
      --bg-surface: #0b0f19;
      --border: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(212, 175, 55, 0.3);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --accent: #6366f1;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --transition-slow: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-sans);
      overflow-x: hidden;
      selection-background-color: var(--gold);
      selection-color: #000;
    }

    body {
      background: var(--bg);
      min-height: 100vh;
      position: relative;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(212, 175, 55, 0.04) 0%, transparent 40%);
    }

    /* Noise overlay for premium film texture */
    .noise-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
      opacity: 0.025;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

    /* ==========================================
       TOP BAR & NAVIGATION
       ================================---------- */
    header {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5vw;
      z-index: 100;
      background: rgba(6, 8, 13, 0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 2px;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span { color: var(--gold); }

    .live-clock-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulsing-dot {
      width: 6px; height: 6px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .top-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }

    .btn-icon:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
    }

    /* ==========================================
       HERO SECTION
       ================================---------- */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 6vw;
      z-index: 2;
    }

    #starfieldCanvas {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 4px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeIn 1s 0.3s forwards var(--transition-slow);
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 7vw, 6.5rem);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 24px;
      max-width: 900px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1.2s 0.5s forwards var(--transition-slow);
    }

    .hero-title em {
      font-style: italic;
      color: var(--gold-light);
    }

    .hero-desc {
      font-size: clamp(1rem, 1.5vw, 1.25rem);
      color: var(--text-muted);
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeInUp 1.2s 0.7s forwards var(--transition-slow);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s ease;
      opacity: 0;
      animation: fadeIn 1.2s 1s forwards;
    }

    .scroll-indicator:hover { color: var(--gold); }
    .scroll-line {
      width: 1px; height: 40px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: scrollBounce 2s infinite;
    }

    @keyframes scrollBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(8px); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================
       MANFESTO / REASON SECTION
       ================================---------- */
    .section {
      padding: 120px 8vw;
      position: relative;
      z-index: 2;
    }

    .manifesto-grid {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 80px;
      align-items: center;
    }

    @media(max-width: 900px) {
      .manifesto-grid { grid-template-columns: 1fr; gap: 40px; }
    }

    .section-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 16px;
      display: block;
    }

    .section-heading {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 4vw, 3.5rem);
      line-height: 1.2;
      margin-bottom: 24px;
    }

    .section-heading em { color: var(--gold-light); font-style: italic; }

    .section-body {
      color: var(--text-muted);
      font-size: 1.125rem;
      line-height: 1.8;
      margin-bottom: 20px;
    }

    /* ==========================================
       DYNAMIC GALLERY (FLEXIBLE PHOTO ARCHIVE)
       ================================---------- */
    .gallery-section {
      background: linear-gradient(to bottom, transparent, var(--bg-surface), transparent);
      padding: 120px 6vw;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 60px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    .memory-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.4s var(--transition-slow);
      cursor: pointer;
      position: relative;
    }

    .memory-card:hover {
      transform: translateY(-8px);
      border-color: var(--border-bright);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .memory-img-wrap {
      width: 100%;
      height: 340px;
      overflow: hidden;
      background: #111;
      position: relative;
    }

    .memory-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--transition-slow);
    }

    .memory-card:hover .memory-img-wrap img {
      transform: scale(1.05);
    }

    .memory-caption {
      padding: 20px;
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .memory-caption span {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--gold);
    }

    /* ==========================================
       INTERACTIVE LIGHT FIELD & RUSSIAN EASTER EGG
       ================================---------- */
    .interactive-canvas-section {
      padding: 100px 6vw;
      text-align: center;
    }

    .canvas-box {
      position: relative;
      width: 100%;
      height: 450px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-top: 40px;
      cursor: crosshair;
    }

    #lightFieldCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-overlay-text {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      pointer-events: none;
      background: rgba(6, 8, 13, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* Russian Secret Note Banner */
    .russian-quote-box {
      margin-top: 80px;
      padding: 40px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.05), rgba(99, 102, 241, 0.05));
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      text-align: center;
      position: relative;
    }

    .russian-quote-box h3 {
      font-family: var(--font-serif);
      font-size: 1.8rem;
      font-style: italic;
      color: var(--gold-light);
      margin-bottom: 12px;
    }

    .russian-quote-box p {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ==========================================
       ENDING & FINALE
       ================================---------- */
    .ending-section {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px 6vw;
      position: relative;
    }

    .keep-moment-btn {
      margin-top: 40px;
      background: var(--gold);
      color: #000;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 2px;
      padding: 16px 36px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
    }

    .keep-moment-btn:hover {
      background: var(--gold-light);
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(212, 175, 55, 0.4);
    }

    .toast-message {
      margin-top: 20px;
      font-family: var(--font-serif);
      font-size: 1.2rem;
      color: var(--gold-light);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    footer {
      padding: 40px 8vw;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-
